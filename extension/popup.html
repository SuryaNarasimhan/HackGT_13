<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>MSAS connection</title></head>
<body>
  <h2>Connect this call to MSAS</h2>
  <p>In MSAS, click <strong>Connect browser tab</strong>. Paste its pairing code here while your call tab is selected.</p>
  <label for="code">Pairing code</label><input id="code" type="password" size="34" autocomplete="off" spellcheck="false">
  <p><button id="connect">Connect this tab</button> <button id="stop">Stop sharing</button></p>
  <p id="status" role="status">Video stays on this laptop. No recordings.</p>
  <script src="popup.js"></script>
</body></html>
